[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-duplex-lab"
version = "0.1.0"
description = "中文端到端语音与异步工具协作实验项目"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "websockets>=14,<17", "numpy>=1.26,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7", "soundfile>=0.12,<1", "scipy>=1.12,<2", "huggingface-hub>=0.30,<1"]

[project.optional-dependencies]
asr = ["sherpa-onnx==1.13.8"]
gpu = ["torch>=2.5,<=2.8.0", "torchaudio>=2.5,<=2.8.0", "numpy>=1.26,<2", "transformers==4.51.3", "accelerate==1.12.0", "peft==0.15.2", "minicpmo-utils[all]==1.0.5", "librosa==0.9.0", "tensorboard>=2.18,<3"]
client = ["sounddevice>=0.5,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
include = ["voice_lab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
voice_lab = ["web/*.html", "web/*.css", "web/*.js"]
